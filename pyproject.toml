[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "orbitx"
version = "0.1.0"
description = "OrbitX Scientific Backend"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sgp4",
    "pydantic",
    "httpx",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
include = ["pythonbackend*"]
exclude = ["web*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]